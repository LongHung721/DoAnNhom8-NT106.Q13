server.port=8080

# ---- Firebase / Firestore ----
# Cách 1: trỏ trực tiếp file json service account (khuyên dùng)
# firebase.serviceAccountPath=C:/firebase/serviceAccountKey.json
# Hoặc dùng classpath:
# firebase.serviceAccountPath=classpath:firebase/serviceAccountKey.json

# Collection names (giữ đúng mô hình dữ liệu cũ)
firestore.collections.accounts=accounts
firestore.collections.foods=foods
firestore.collections.orders=orders

# JWT secret (đổi khi deploy)
security.jwt.secret=change-me-please
security.jwt.expMinutes=720
