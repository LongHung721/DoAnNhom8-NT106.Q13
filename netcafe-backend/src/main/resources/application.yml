server:
  port: 8080

app:
  jwt:
    # Change this in production (at least 32+ chars). You can also set env APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:change-me-please-change-me-please}
    ttlMinutes: 1440
  firestore:
    # Auth collection used by your existing frontend/server code
    authCollection: ${APP_AUTH_COLLECTION:Khach_Hang}
    # Other collections (optional)
    foodsCollection: ${APP_FOODS_COLLECTION:foods}
    ordersCollection: ${APP_ORDERS_COLLECTION:orders}
    chatCollection: ${APP_CHAT_COLLECTION:chat}

firebase:
  # If empty, the app will rely on GOOGLE_APPLICATION_CREDENTIALS env var.
  serviceAccountPath: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
